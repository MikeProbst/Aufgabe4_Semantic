name: Tests, Build und Semantic Versioning

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: m324-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit-Tests
    uses: ./.github/workflows/unit-tests.yml

  e2e-tests:
    name: E2E-Tests
    uses: ./.github/workflows/e2e-tests.yml

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  build:
    name: Build
    needs: [unit-tests, e2e-tests, lint]
    uses: ./.github/workflows/build.yml

  tag:
    name: Versions-Tag erstellen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, e2e-tests, lint, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository inklusive Tags laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Git-Identität konfigurieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Versions-Tag erstellen
        run: node scripts/version-tag.mjs

      - name: Versions-Tag hochladen
        shell: bash
        run: |
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              git push origin "refs/tags/$tag"
            fi
          done < <(git tag --points-at HEAD)