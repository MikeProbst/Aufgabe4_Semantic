name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Vue-Projekt bauen
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sematic

    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sematic/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build ausführen
        run: npm run build